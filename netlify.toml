
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/exercises"
  to = "/.netlify/functions/exercises"
  status = 200
  force = true

  [[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


[[edge_functions]]
function = "exercises"
path = "/api/exercises"

